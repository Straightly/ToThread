<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://tothread-webapp.zhian-job.workers.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data:">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <!-- Extension Instructions Section (removed for now) -->

    <!-- Plan Viewer Section (iOS only) -->
    <div id="plan-section" class="platform-ios" style="display: none; padding: 12px 20px 20px 20px;">
        <div id="plan-login" style="text-align: center;">
            <h2>Project Plan</h2>
            <p>Sign in with Google to view and manage your project plan.</p>
            <button id="google-login-btn">Sign in with Google</button>
        </div>

        <div id="plan-view" style="display: none;">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                <button id="back-btn" disabled>← Back</button>
                <h2 style="margin: 0; flex: 1;">Project Plan</h2>
                <button id="refresh-btn" title="Refresh">⟳</button>
            </div>

            <div style="font-size: 12px; color: #666; margin-bottom: 8px;">
                Level: <span id="current-level">Root</span>
            </div>

            <div style="font-size: 12px; color: #666; margin-bottom: 10px;">
                Last sync: <span id="last-sync">—</span>
            </div>
            <div style="font-size: 12px; color: #666; margin-bottom: 10px;">
                Status: <span id="plan-status">—</span>
            </div>

            <label style="margin-bottom: 10px; display: block;">
                <input type="checkbox" id="show-finished-toggle">
                Show finished tasks
            </label>

            <button id="add-task-btn" style="margin-bottom: 15px;">+ Add Task</button>

            <div id="tasks-container" style="border: 1px solid #ddd; border-radius: 8px; padding: 10px;">
                <p id="loading" style="text-align: center; color: #999;">Loading tasks...</p>
                <div id="task-list"></div>
            </div>

            <div style="margin-top: 15px; text-align: center;">
                <button id="logout-btn" style="background-color: #f0f0f0; color: #333;">Sign Out</button>
            </div>
        </div>

        <div id="plan-error" style="display: none; background-color: #fee; border: 1px solid #f99; border-radius: 4px; padding: 10px; color: #c00;">
            <span id="error-message"></span>
        </div>

        <!-- Task Details Overlay -->
        <div id="task-details-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(255,255,255,0.98); z-index:10000; overflow:auto;">
            <div style="max-width:600px; margin:40px auto 20px auto; background:#fff; border-radius:12px; box-shadow:0 2px 16px #0002; padding:24px 18px 18px 18px; position:relative;">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;">
                    <h2 style="margin:0;">Edit Task Details</h2>
                    <button id="close-task-details" style="font-size:22px; background:none; border:none; cursor:pointer;">×</button>
                </div>
                <form id="task-details-form">
                    <label>Title:<br><input type="text" id="task-title" style="width:100%;margin-bottom:10px;"></label><br>
                    <label>Tags (comma separated):<br><input type="text" id="task-tags" style="width:100%;margin-bottom:10px;"></label><br>
                    <label>Description:<br><textarea id="task-description" rows="3" style="width:100%;margin-bottom:10px;"></textarea></label><br>
                    <label>Result:<br><textarea id="task-result" rows="2" style="width:100%;margin-bottom:10px;"></textarea></label><br>
                    <label>Status:<br>
                        <select id="task-status" style="width:100%;margin-bottom:10px;">
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Blocked">Blocked</option>
                            <option value="Done">Done</option>
                            <option value="Continuous">Continuous</option>
                        </select>
                    </label><br>
                    <div id="arbitrary-fields-container" style="margin-bottom:10px;"></div>
                    <button type="button" id="add-field-btn" style="margin-bottom:10px;">+ Add Field</button>
                    <div style="text-align:right;">
                        <button type="submit" style="background:#175cd3;color:#fff;padding:8px 18px;border:none;border-radius:4px;font-size:16px;">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
