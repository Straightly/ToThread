<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention - Todo Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Attention - Todo Manager</h1>
            <p class="subtitle">Manage your todos</p>
        </header>

        <!-- Google sign-in section for ToThread backend -->
        <div id="setup-section" class="section">
            <h2>🔐 Sign in with Google</h2>
            <p class="subtitle">Sign in to access your todos via the ToThread backend.</p>
            <div id="g_id_signin"></div>
            <p id="auth-status" class="status">Not signed in.</p>
        </div>

        <div id="app-section" class="section" style="display: none;">
            <div class="controls">
                <div class="file-info">
                    <span class="file-label">📄 Managing: <strong>ToDos/List.json</strong></span>
                    <button id="refresh-file" class="btn btn-secondary">🔄 Refresh</button>
                    <button id="logout-btn" class="btn btn-secondary">🚪 Logout</button>
                </div>
                <div class="status" id="status"></div>
            </div>

            <div class="add-todo">
                <input type="text" id="new-todo" placeholder="Add new todo item (use #tags like #work #idea)..." />
                <button id="add-todo-btn" class="btn btn-primary">Add Todo</button>
            </div>

            <div id="tag-filters" class="tag-filters"></div>

            <div class="todo-list-header">
                <div class="header-checkbox">
                    <input type="checkbox" id="show-completed-toggle" />
                    <label for="show-completed-toggle">👁️ Show Completed</label>
                </div>
            </div>

            <div id="todo-list" class="todo-list"></div>

            <div class="actions">
                <button id="save-changes" class="btn btn-success" disabled>💾 Save Changes</button>
                <span id="changes-indicator"></span>
            </div>

            <hr style="margin: 40px 0; border: none; border-top: 2px solid #e9ecef;">

            <div class="raw-writing-section">
                <h2>✍️ Capture Raw Writing</h2>
                <p class="subtitle">Quick capture for spontaneous thoughts and ideas</p>
                
                <div class="writing-input">
                    <label for="raw-writing-text">Your raw thought or idea:</label>
                    <textarea 
                        id="raw-writing-text" 
                        placeholder="Type your raw thought here... It will be saved as a structured markdown file in Writing/RawWrittings/"
                        rows="6"
                    ></textarea>
                    
                    <div class="writing-actions">
                        <button id="save-writing-btn" class="btn btn-primary">💾 Save Raw Writing</button>
                        <span id="writing-status" class="status"></span>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>Made with ❤️ for organizing your thoughts</p>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="js/todo-manager.js"></script>
    <script src="js/writing-manager.js"></script>
    <script src="js/tothread-api.js"></script>
    <script src="js/tothread-file-api.js"></script>
    <script src="js/todo-ui.js"></script>
    <script src="js/app.js"></script>

    <script>
      // Google Identity Services integration for ToThread UI
      const CLIENT_ID =
        "130905058858-07408ql1m1nonfoaftc415t0er256n5v.apps.googleusercontent.com";

      function setAuthStatus(text) {
        const el = document.getElementById("auth-status");
        if (el) el.textContent = text;
      }

      window.handleCredentialResponse = (response) => {
        const idToken = response && response.credential;
        if (!idToken) {
          setAuthStatus("Failed to obtain ID token.");
          return;
        }

        try {
          if (window.ToThreadAuth && typeof window.ToThreadAuth.setIdToken === "function") {
            window.ToThreadAuth.setIdToken(idToken);
            setAuthStatus("Signed in. Loading todos...");
          } else {
            setAuthStatus("Backend auth wiring (ToThreadAuth) is not ready.");
          }
        } catch (e) {
          setAuthStatus("Error initializing app: " + e);
        }
      };

      window.onload = () => {
        if (!window.google || !window.google.accounts || !window.google.accounts.id) {
          setAuthStatus("Google Identity Services not loaded.");
          return;
        }

        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: window.handleCredentialResponse,
        });

        google.accounts.id.renderButton(document.getElementById("g_id_signin"), {
          theme: "outline",
          size: "large",
        });

        google.accounts.id.prompt();
      };
    </script>
</body>
</html>
